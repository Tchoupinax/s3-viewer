name: Release 🔥

on:
  push:
    tags:
    - "*"

jobs:
  build-application-docker:
    name: Build container for application 🐳
    runs-on: ubuntu-24.04
    permissions:
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build application 🦫
      uses: tchoupinax/repo-config/shared-actions/steps/node/build@master
      with:
        workingDirectory: apps/s3-viewer
        nodeVersion: 26

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ghcr.io/tchoupinax/s3-viewer
          tchoupinax/s3-viewer
        flavor: latest=true
        tags: |
          type=semver,pattern=v{{version}}

    - name: Build and push image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: apps/s3-viewer/Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        # Layer + build cache in the registry so cargo deps stay warm across runs.
        # mode=max keeps intermediate (builder) layers, which matters for zigbuild.
        cache-from: type=registry,ref=ghcr.io/tchoupinax/s3-viewer:buildcache
        cache-to: type=registry,ref=ghcr.io/tchoupinax/s3-viewer:buildcache,mode=max
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  build-operator-docker:
    name: Build container for operator 🐳
    runs-on: ubuntu-24.04
    permissions:
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ghcr.io/tchoupinax/s3-viewer-operator
          tchoupinax/s3-viewer-operator
        flavor: latest=true
        tags: |
          type=semver,pattern=v{{version}}

    - name: Build and push image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: apps/s3-viewer-operator/Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        # Layer + build cache in the registry so cargo deps stay warm across runs.
        # mode=max keeps intermediate (builder) layers, which matters for zigbuild.
        cache-from: type=registry,ref=ghcr.io/tchoupinax/s3-viewer-operator:buildcache
        cache-to: type=registry,ref=ghcr.io/tchoupinax/s3-viewer-operator:buildcache,mode=max
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  publish-helm-chart:
    name: Publish Helm chart (OCI) 📦
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set chart version from tag
      id: version
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        sed -i "s/^version: .*/version: ${VERSION}/" charts/s3-viewer/Chart.yaml
        sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" charts/s3-viewer/Chart.yaml
        sed -i "s/^    tag: .*/    tag: ${VERSION}/" charts/s3-viewer/values.yaml
        sed -i "s|^  defaultAppImage: .*|  defaultAppImage: ghcr.io/tchoupinax/s3-viewer:${VERSION}|" charts/s3-viewer/values.yaml

    - name: Install Helm
      uses: azure/setup-helm@v5

    - name: Lint chart
      run: helm lint charts/s3-viewer

    - name: Package chart
      run: helm package charts/s3-viewer

    - name: Log in to GitHub Container Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

    - name: Push chart to OCI registry
      run: helm push s3-viewer-operator-${{ steps.version.outputs.version }}.tgz oci://ghcr.io/tchoupinax/helm
