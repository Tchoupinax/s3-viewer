apiVersion: v1
kind: Namespace
metadata:
  name: copper

---
apiVersion: s3viewer.dev/v1
kind: S3ViewerConfig
metadata:
  name: default
  namespace: copper
spec:
  accounts:
    - accountKey: MEDIA
      id: minio-media
      name: Media
      endpoint: http://minio-media.minio.svc.cluster.local:9000
      region: us-east-1
      readOnly: false
      credentialsSecretRef:
        name: minio-media-creds
        accessKeyKey: access-key
        secretKeyKey: secret-key

---
apiVersion: s3viewer.dev/v1
kind: S3Viewer
metadata:
  name: demo
  namespace: copper
spec:
  replicas: 1
  service:
    port: 3000
    type: ClusterIP
  ingress:
    host: copper.127.0.0.1.nip.io
