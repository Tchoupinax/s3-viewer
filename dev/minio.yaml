---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-backups-init
  namespace: minio
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          command:
            - /bin/sh
            - -ec
            - |
              until mc alias set local http://minio-backups:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for minio-backups..."
                sleep 2
              done
              mc mb --ignore-existing local/backups
              printf '%s\n' 'sample backup dump 1' > /tmp/backup-001.sql.gz
              printf '%s\n' 'sample backup dump 2' > /tmp/backup-002.sql.gz
              printf '%s\n' '{"version":1,"bucket":"backups"}' > /tmp/manifest.json
              mc cp /tmp/backup-001.sql.gz local/backups/
              mc cp /tmp/backup-002.sql.gz local/backups/
              mc cp /tmp/manifest.json local/backups/
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-backups-root
                  key: access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-backups-root
                  key: secret-key

