              printf '%s\n' '2026-08-02 INFO request handled' > /tmp/app-2026-08-02.log
              printf '%s\n' '127.0.0.1 GET /health 200' > /tmp/nginx-access.log
              mc cp /tmp/app-2026-08-01.log local/logs/
              mc cp /tmp/app-2026-08-02.log local/logs/
              mc cp /tmp/nginx-access.log local/logs/
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-logs-root
