apiVersion: v1
kind: Namespace
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio

---
apiVersion: v1
kind: Secret
metadata:
  name: minio-backups-root
  namespace: minio
type: Opaque
stringData:
  access-key: minio-backups
  secret-key: minio-backups-secret

---
apiVersion: v1
kind: Secret
metadata:
  name: minio-logs-root
  namespace: minio
type: Opaque
stringData:
  access-key: minio-logs
