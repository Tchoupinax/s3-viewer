[package]
name = "s3-viewer-operator"
version = "0.1.0"
edition = "2021"

[lib]
name = "s3_viewer_operator"
path = "src/lib.rs"

[[bin]]
name = "s3-viewer-operator"
path = "src/main.rs"

[[bin]]
name = "crd-gen"
path = "src/bin/crd-gen.rs"

[dependencies]
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "net", "io-util"] }
kube = { version = "1.0.0", default-features = false, features = ["client", "derive", "runtime", "rustls-tls"] }
k8s-openapi = { version = "0.25.0", default-features = false, features = ["v1_33"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_yaml = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
prometheus = "0.13"
